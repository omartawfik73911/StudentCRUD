<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <title>Student CRUD</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 40px auto;
            background: #f4f4f4;
        }

        h1 {
            color: #333;
        }

        form {
            background: white;
            padding: 20px;
            margin-bottom: 25px;
            border-radius: 8px;
        }

        input {
            padding: 10px;
            margin-right: 10px;
        }

        button {
            padding: 10px 18px;
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 12px;
        }

        th {
            background: #333;
            color: white;
        }

        a {
            margin-right: 10px;
        }

    </style>
</head>

<body>

<h1>Student Management System</h1>

<h2>Add / Edit Student</h2>

<form th:action="@{/save}"
      th:object="${student}"
      method="post">

    <input type="hidden"
           th:field="*{id}">

    <input type="text"
           th:field="*{name}"
           placeholder="Student name"
           required>

    <input type="email"
           th:field="*{email}"
           placeholder="Email"
           required>

    <button type="submit">
        Save Student
    </button>

</form>

<h2>Students</h2>

<table>

    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Email</th>
        <th>Actions</th>
    </tr>

    <tr th:each="student : ${students}">

        <td th:text="${student.id}"></td>

        <td th:text="${student.name}"></td>

        <td th:text="${student.email}"></td>

        <td>

            <a th:href="@{/edit/{id}(id=${student.id})}">
                Edit
            </a>

            <a th:href="@{/delete/{id}(id=${student.id})}">
                Delete
            </a>

        </td>

    </tr>

</table>

</body>

</html>
